# CodeRabbit review settings for homelab-recipes.
#
# Everything here is scrubbed from a real, running home before it's published. The review's main job is
# to catch anything the scrub missed. It is a second layer, not the gate: a pushed branch in a public
# repo is already public, so the scrub happens before the push.
language: en-AU

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
    base_branches: [".*"]

  tools:
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    ruff:
      enabled: true

  path_instructions:
    - path: "**/*"
      instructions: |
        PRIVACY AND SECRETS REVIEW. This content is scrubbed from a private home automation setup before
        publishing. Flag, as a blocking issue, anything that identifies the home, its network or its owner,
        or that grants access:
        - Credentials of any kind: tokens, API keys, passwords, bearer headers, share or pairing codes,
          QR payloads, long random-looking strings.
        - Private network details: private IPs (192.168.x.x, 10.x.x.x, 172.16-31.x.x), ports tied to a
          specific host, MAC addresses, .local hostnames, WiFi SSIDs, personal domain names or
          subdomains, Nabu Casa remote URLs.
        - Personal identifiers: email addresses, people's names, account or config-entry IDs, electricity
          meter numbers (NMI), vehicle or site names chosen by the owner.
        - Home Assistant entity IDs that embed a personal site, device or person name. Stock
          integration-generated names are fine; owner-chosen names should be __UPPER_SNAKE__ placeholders.
        Placeholders look like __UPPER_SNAKE__ and are expected. Example values in README tables
        (e.g. sensor.<site>_grid_power, person.alex) are fine.

    - path: "**/*.yaml"
      instructions: |
        Home Assistant YAML meant to be copied by strangers and their AI agents. Also check: any
        __PLACEHOLDER__ used in the file is listed in the folder README's substitution table; templates
        guard against unavailable states (float defaults, is_number); nothing sets `initial:` on helpers
        whose values should survive a restart; and nothing can over-dispense, over-heat or loop.

    - path: "**/*.py"
      instructions: |
        Scripts talk to a user's Home Assistant. Tokens and URLs must come from environment variables with
        no default address; the script must never print a token; writes must be dry-run by default.

    - path: "**/README.md"
      instructions: |
        Check the README's claims match the files next to it (placeholders, file names, what's proven vs
        not). Flag any claim of "tested" or "proven" the README doesn't back up.
